{% extends 'catalog/base.html' %}
{% block content %}

<form method="POST" action="" class="form-floating" enctype="multipart/form-data">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="card mb-6 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">
                        Введите емейл и пароль для входа
                    </h4>
                </div>
                <div class="card-body">
                    {% csrf_token %}
                    {{ form.as_p}}
                    <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Войти</button>
                    <a class="p-2 btn btn-outline-primary" href="{% url 'users:password_reset' %}">Восстановить
                        пароль</a>

                </div>
            </div>
        </div>
    </div>
</form>

{% endblock %}
