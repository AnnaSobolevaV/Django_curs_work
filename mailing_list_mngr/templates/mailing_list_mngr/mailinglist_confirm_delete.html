{% extends 'mailing_list_mngr/base.html' %}
{% block content %}
{% if user.is_authenticated and user == object.owner %}
<div class="card px-4 py-5 my-5 text-center">
    <h2 class="display-5 fw-bold text-body-emphasis">Удаление рассылки</h2>
</div>
<div class="col-lg-9 mx-auto">
    <div class="row">
        <div class="col-lg-6 col-md-6 col-sm-12">
            <div class="card mb-6 box-shadow">
                <div class="card-header">
                    <h4 class="my-0 font-weight-normal">Подтвердите удаление рассылки {{ object.header }}</h4>
                </div>
                <div class="card-body">
                    <form method="post" action="" class="form-floating" enctype="multipart/form-data">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-lg btn-block btn-outline-primary">Удалить</button>
                        <a class="btn btn-primary" href="{% url 'mailing_list_mngr:mailing_list_detail' object.id %}"
                           role="button">
                            Отменить</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
{% endblock %}
